<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Override</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #f1f5f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            color: #0f172a;
        }

        .card {
            background: #fff;
            border-radius: 16px;
            padding: 40px 36px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
        }

        h1 {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 6px;
            color: #1e293b;
        }

        .meta {
            font-size: 0.8rem;
            color: #94a3b8;
            margin-bottom: 28px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #475569;
            margin-bottom: 6px;
        }

        select, textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 0.9rem;
            font-family: inherit;
            color: #0f172a;
            background: #f8fafc;
            margin-bottom: 20px;
            outline: none;
            transition: border-color 0.15s;
        }

        select:focus, textarea:focus {
            border-color: #6366f1;
            background: #fff;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .action-row {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .action-opt {
            flex: 1;
        }

        .action-opt input[type="radio"] {
            display: none;
        }

        .action-opt label {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            color: #64748b;
            transition: all 0.15s;
            margin-bottom: 0;
        }

        .action-opt input[type="radio"]:checked + label {
            border-color: #6366f1;
            background: #eef2ff;
            color: #4338ca;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: #4f46e5;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.15s;
        }

        .btn:hover { background: #4338ca; }

        .alert {
            padding: 14px 16px;
            border-radius: 10px;
            font-size: 0.88rem;
            font-weight: 500;
            margin-bottom: 24px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .alert.ok  { background: #ecfdf5; border: 1px solid #6ee7b7; color: #065f46; }
        .alert.err { background: #fef2f2; border: 1px solid #fca5a5; color: #991b1b; }

        .alert .api-note {
            font-size: 0.78rem;
            opacity: 0.8;
            margin-top: 4px;
        }

        .divider {
            border: none;
            border-top: 1px solid #e2e8f0;
            margin: 24px 0;
        }

        .admin-info {
            font-size: 0.78rem;
            color: #94a3b8;
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Attendance Override</h1>
        <p class="meta">Logged in as <strong>{{ request.user.username }}</strong></p>

        {% if result %}
            {% if result.success %}
                <div class="alert ok">
                    <span>&#10003; {{ result.message }}</span>
                    {% if not result.api_ok %}
                        <span class="api-note">&#9888; External API did not confirm: {{ result.api_msg }}</span>
                    {% endif %}
                </div>
            {% else %}
                <div class="alert err">&#10005; {{ result.message }}</div>
            {% endif %}
        {% endif %}

        <form method="post" autocomplete="off">
            {% csrf_token %}

            <label for="api_user_id">Employee</label>
            <select id="api_user_id" name="api_user_id" required>
                <option value="">— Select employee —</option>
                {% for u in users %}
                    <option value="{{ u.api_user_id }}">{{ u.username|title }}</option>
                {% endfor %}
            </select>

            <label>Action</label>
            <div class="action-row">
                <div class="action-opt">
                    <input type="radio" id="ci" name="action" value="check_in" required>
                    <label for="ci">&#128338; Check In</label>
                </div>
                <div class="action-opt">
                    <input type="radio" id="co" name="action" value="check_out">
                    <label for="co">&#127968; Check Out</label>
                </div>
            </div>

            <button type="submit" class="btn">Submit Override</button>
        </form>
    </div>
</body>
</html>
